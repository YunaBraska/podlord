name: 🧩 CI · Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: podlord-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_dotnet_build_common.yml@a6f230e7a31ec0f44951200e29dab1639f7309c5
    with:
      ref: ${{ github.event.pull_request.head.sha }}
