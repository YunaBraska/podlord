name: "🔍 CI · Pull Request"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podlord-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_dotnet_build_common.yml@0c16fe69a5b69ad9da903c444f855b19d4d555fc
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
