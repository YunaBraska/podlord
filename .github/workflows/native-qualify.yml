name: Native qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part native application version.
        required: false
        default: 0.1.0
        type: string
  workflow_call:
    inputs:
      version:
        description: Three-part native application version.
        required: false
        default: 0.1.0
        type: string

permissions:
  actions: read
  contents: read

jobs:
  native-preflight:
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ inputs.version || '0.1.0' }}

  linux-package-preflight:
    uses: ./.github/workflows/native-linux-package.yml
    with:
      version: ${{ inputs.version || '0.1.0' }}
  candidate:
    needs: [native-preflight, linux-package-preflight]
    runs-on: ubuntu-24.04
    steps:
      # Only package inputs, not the Store bundles, SDKs or full preflight evidence.
      - uses: actions/download-artifact@v7
        with:
          name: native-package-direct-macos-15-${{ github.sha }}
          path: native-input/native-package-direct-macos-15-${{ github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: native-package-direct-macos-15-intel-${{ github.sha }}
          path: native-input/native-package-direct-macos-15-intel-${{ github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: native-windows-x64-${{ github.sha }}
          path: native-input/native-windows-x64-${{ github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: native-linux-trial-x64-${{ github.sha }}
          path: native-input/native-linux-trial-x64-${{ github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: native-linux-trial-arm64-${{ github.sha }}
          path: native-input/native-linux-trial-arm64-${{ github.sha }}
      - name: Collect verified native desktop candidates
        shell: sh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          mkdir native-candidate
          cp "native-input/native-package-direct-macos-15-$SOURCE_COMMIT/native-package/podlord-native.zip" native-candidate/podlord-native-macos-arm64.zip
          cp "native-input/native-package-direct-macos-15-intel-$SOURCE_COMMIT/native-package/podlord-native.zip" native-candidate/podlord-native-macos-x64.zip
          cp "native-input/native-windows-x64-$SOURCE_COMMIT/podlord-windows-x64.zip" native-candidate/podlord-native-win-x64.zip
          for arch in x64 arm64; do
            cp "native-input/native-linux-trial-$arch-$SOURCE_COMMIT/package/podlord-native-linux-$arch.tar.gz" "native-candidate/podlord-native-linux-$arch.tar.gz"
          done
          : > native-candidate/size-evidence.txt
          for archive in native-candidate/*.zip native-candidate/*.tar.gz; do
            bytes=$(wc -c < "$archive") || {
              result=$?
              printf 'Candidate download measurement failed: %s (exit %s)\n' "$archive" "$result" >&2
              exit "$result"
            }
            bytes=$(printf '%s' "$bytes" | tr -d '[:space:]')
            case "$bytes" in ''|*[!0-9]*) printf 'Invalid candidate download measurement: %s\n' "$archive" >&2; exit 1 ;; esac
            [ "$bytes" -gt 0 ] || { printf 'Invalid candidate download measurement: %s\n' "$archive" >&2; exit 1; }
            printf 'Archive: %s; download bytes: %s; advisory target: 50000000\n' "$archive" "$bytes" >> native-candidate/size-evidence.txt
            if [ "$bytes" -gt 50000000 ]; then
              printf 'WARNING: package-size advisory: archive=%s metric=download measured_bytes=%s target_bytes=50000000\n' "$archive" "$bytes" | tee -a native-candidate/size-evidence.txt >&2
            fi
          done
          (cd native-candidate && sha256sum ./*.zip ./*.tar.gz > SHA256SUMS)
          printf '%s\n' "$SOURCE_COMMIT" > native-candidate/SOURCE_COMMIT
          printf '%s\n' 'Native desktop candidate archives for macOS, Windows and Linux only. Collection does not establish release approval. Mobile packages, visual and performance evidence, licensing and publisher gates remain separate. Store submission is not performed.' > native-candidate/SCOPE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: podlord-native-candidates-${{ github.sha }}
          compression-level: 0
          path: native-candidate
          if-no-files-found: error
          retention-days: 14
