# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_dotnet_release.yml@d2ea500ddc9695fefa2b78e5f7b41fd759a47575
    with:
      force: ${{ inputs.force }}
      notarize_macos: true
    secrets: inherit
