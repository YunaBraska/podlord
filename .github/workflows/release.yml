# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_dotnet_release.yml@f74836618ecd83210f0c02f639223193fcef4245
    with:
      force: ${{ inputs.force }}
      notarize_macos: true
    secrets: inherit
