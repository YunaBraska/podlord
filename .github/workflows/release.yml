name: Native release candidate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  native-preflight:
    uses: ./.github/workflows/native.yml

  candidate:
    needs: native-preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*-${{ github.sha }}
          path: native-input
      - name: Collect verified native desktop candidates
        shell: sh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          mkdir native-candidate
          cp "native-input/native-preflight-macos-15-$SOURCE_COMMIT/native-package/podlord-native.zip" native-candidate/podlord-native-macos-arm64.zip
          cp "native-input/native-preflight-macos-15-intel-$SOURCE_COMMIT/native-package/podlord-native.zip" native-candidate/podlord-native-macos-x64.zip
          cp "native-input/native-windows-x64-$SOURCE_COMMIT/podlord-windows-x64.zip" native-candidate/podlord-native-win-x64.zip
          for archive in native-candidate/*.zip; do
            bytes=$(wc -c < "$archive")
            [ "$bytes" -gt 0 ] && [ "$bytes" -le 50000000 ] || { printf 'Candidate exceeds the existing download gate: %s\n' "$archive" >&2; exit 1; }
          done
          (cd native-candidate && sha256sum ./*.zip > SHA256SUMS)
          printf '%s\n' "$SOURCE_COMMIT" > native-candidate/SOURCE_COMMIT
          printf '%s\n' 'Native desktop candidates only. No tag, GitHub release, Store upload or release approval is created. Linux/mobile packages and full visual, performance, licensing and publisher gates remain required.' > native-candidate/SCOPE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: podlord-native-candidates-${{ github.sha }}
          path: native-candidate
          if-no-files-found: error
          retention-days: 14
