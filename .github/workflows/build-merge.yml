name: Snapshot

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - docs/**
      - doc/**
      - .github/workflows/product-pages.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: podlord-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/ci.yml
