name: CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part native application version.
        required: false
        default: 0.1.0
        type: string
  workflow_call:
    inputs:
      version:
        description: Three-part native application version.
        required: false
        default: 0.1.0
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  native-preflight:
    uses: ./.github/workflows/native-qualify.yml
    with:
      version: ${{ inputs.version || '0.1.0' }}
