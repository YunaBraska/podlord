name: CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part native application version.
        required: false
        default: 0.1.0
        type: string
  workflow_call:
    inputs:
      version:
        description: Three-part native application version.
        required: false
        default: 0.1.0
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  native-preflight:
    uses: ./.github/workflows/native-qualify.yml
    with:
      version: ${{ inputs.version || '0.1.0' }}
  build:
    if: ${{ always() }}
    needs: native-preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete native candidate
        shell: sh
        env:
          NATIVE_RESULT: ${{ needs.native-preflight.result }}
        run: |
          set -eu
          [ "$NATIVE_RESULT" = success ] || {
            printf 'Native qualification did not succeed: %s\n' "$NATIVE_RESULT" >&2
            exit 1
          }
