name: CI

on:
  push:
    branches:
      - dev
      - 'feat/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-preflight:
    uses: ./.github/workflows/native.yml

  test:
    name: Test with k3d
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run tests
        shell: sh
        run: scripts/test.sh --configuration Release

      - name: Verify coverage gate boundaries
        shell: sh
        run: python3 scripts/test-coverage-gates.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            /tmp/podlord-test.*/results/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14
