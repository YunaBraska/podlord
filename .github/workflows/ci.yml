name: CI

on:
  push:
    branches:
      - dev
      - 'feat/**'
    paths-ignore:
      - 'doc/ROADMAP.md'
      - 'doc/spec/k3d-test-map.md'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-preflight:
    uses: ./.github/workflows/native.yml
