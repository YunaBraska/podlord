name: Upload prepared native Store package

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store package to upload.
        required: true
        default: macos
        type: choice
        options:
          - macos
          - ios

permissions:
  contents: read
  actions: read

jobs:
  retrieve:
    runs-on: ubuntu-24.04
    outputs:
      artifact-extension: ${{ steps.package-kind.outputs.artifact-extension }}
    steps:
      - name: Select the verified Store package
        id: package-kind
        env:
          PLATFORM: ${{ inputs.platform }}
        shell: sh
        run: |
          set -eu
          case "$PLATFORM" in
            macos)
              printf 'artifact-name=app-store-package\n' >> "$GITHUB_OUTPUT"
              printf 'artifact-extension=pkg\n' >> "$GITHUB_OUTPUT"
              printf 'package-file=Podlord.pkg\n' >> "$GITHUB_OUTPUT"
              ;;
            ios)
              printf 'artifact-name=ios-app-store-package\n' >> "$GITHUB_OUTPUT"
              printf 'artifact-extension=ipa\n' >> "$GITHUB_OUTPUT"
              printf 'package-file=Podlord.ipa\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'Unsupported Store platform: %s\n' "$PLATFORM" >&2
              exit 2
              ;;
          esac
      - name: Resolve the latest successful stable package
        id: package-run
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: sh
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=$DEFAULT_BRANCH&per_page=100" > source-runs.json
          PACKAGE_RUN=$(jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' source-runs.json | sed -n '1p')
          case "$PACKAGE_RUN" in ''|*[!0-9]*) printf 'No successful stable release package exists on %s.\n' "$DEFAULT_BRANCH" >&2; exit 2 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" > source-run.json
          jq -e '.conclusion == "success" and .path == ".github/workflows/release.yml" and .head_branch == env.DEFAULT_BRANCH' source-run.json
          printf 'package-run-id=%s\n' "$PACKAGE_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.package-run.outputs.package-run-id }}
          name: ${{ steps.package-kind.outputs.artifact-name }}
          path: app-store-package
      - name: Reject incomplete Store package
        env:
          PLATFORM: ${{ inputs.platform }}
          PACKAGE_FILE: ${{ steps.package-kind.outputs.package-file }}
        shell: sh
        run: |
          set -eu
          test -f "app-store-package/$PACKAGE_FILE"
          case "$PLATFORM" in
            macos)
              grep -Fx 'implementation=cpp' app-store-package/native-build.txt
              grep -Fx 'architectures=arm64 x86_64' app-store-package/native-build.txt
              ;;
            ios)
              grep -Eq '^Signed iPhone and iPad IPA built from [0-9a-f]{40}\.$' app-store-package/ios-store-evidence.txt
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: app-store-upload
          path: app-store-package
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: retrieve
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store_upload.yml@cbab854713e514f28a2ea8556d66ad416fc0aff9
    with:
      app_name: Podlord
      artifact_name: app-store-upload
      artifact_extension: ${{ needs.retrieve.outputs.artifact-extension }}
    secrets: inherit
