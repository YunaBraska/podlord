name: "📖 CD · Product Pages"

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - doc/**
      - .github/workflows/product-pages.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/**
      - doc/**
      - .github/workflows/product-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_product_pages.yml@55084c6bba6526a0ab28451ad2e2503f7c0cbc98
    with:
      publish: ${{ github.event_name != 'pull_request' }}
