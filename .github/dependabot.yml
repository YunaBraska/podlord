version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
      time: '00:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      nuget-all:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
      time: '00:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns:
          - "*"
