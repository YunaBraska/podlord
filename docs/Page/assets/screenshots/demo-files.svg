  <text x="396" y="226" fill="#ad9f86" font-family="Menlo, Consolas, monospace" font-size="17" text-anchor="end">⌄</text>
  <text x="441" y="226" fill="#f0dfc1" font-family="Menlo, Consolas, monospace" font-size="16">app</text>
  <text x="807" y="226" fill="#ad9f86" font-family="Menlo, Consolas, monospace" font-size="17" text-anchor="end">⌄</text>
  <rect x="18" y="259" width="45" height="43" fill="#0a0a09" stroke="#5d5343"/>
  <text x="41" y="287" fill="#e9d7b9" font-family="Menlo, Consolas, monospace" font-size="24" text-anchor="middle">‹</text>
  <text x="78" y="287" fill="#f0dfc1" font-family="Menlo, Consolas, monospace" font-size="16">/app</text>
  <rect x="777" y="259" width="45" height="43" fill="#0a0a09" stroke="#5d5343"/>
  <text x="800" y="287" fill="#e9d7b9" font-family="Menlo, Consolas, monospace" font-size="24" text-anchor="middle">↻</text>
  <line x1="18" y1="316" x2="822" y2="316" stroke="#5d5343"/>
