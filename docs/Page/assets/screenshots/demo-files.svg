    <text x="31" y="346" fill="#d8ae65">▸</text><text x="63" y="346" fill="#f0dfc1">config/</text>
    <text x="31" y="390" fill="#d8ae65">▸</text><text x="63" y="390" fill="#f0dfc1">public/</text>
