<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.product | escape }} | {{ site.product | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body class="theme-{{ site.color_scheme | default: 'light' }}" style="--accent: {{ site.accent }}; --accent-soft: {{ site.accent_soft }};">
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="container header-content">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.product }}</a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Overview</a>
          <a href="{{ '/documentation.html' | relative_url }}">Documentation</a>
          <a href="{{ '/install.html' | relative_url }}">Get the app</a>
        </nav>
      </div>
    </header>
    <main id="content" class="container">
      {% if page.help %}
      <article class="help-document">
        {{ content }}
      </article>
      {% else %}
      {{ content }}
      {% endif %}
    </main>
    <footer class="site-footer">
      <div class="container footer-content">
        <span>{{ site.product }}</span>
        <span><a href="{{ '/privacy.html' | relative_url }}">Privacy</a><a href="{{ site.repository }}">Source</a><a href="{{ site.support }}">Support</a></span>
      </div>
    </footer>
  </body>
</html>
